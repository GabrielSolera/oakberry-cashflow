<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carga anual · OakBerry Centroamérica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #FAF9F6; --ink: #221A2B; --ink-soft: #6B6274;
    --acai: #4A1942; --acai-soft: #7A4270;
    --mint: #2E7D53; --mint-bg: #E7F3EC;
    --rust: #B4402A; --rust-bg: #FBEBE7;
    --border: #E5E1DC; --card: #FFFFFF;
    --real-bg: #F4F0F6; --proj-bg: #FBFAF7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; font-feature-settings: "tnum" 1, "lnum" 1; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 32px 40px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 14px; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .mark { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, var(--acai-soft), var(--acai) 70%); flex-shrink: 0; }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 23px; margin: 0; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: 13.5px; margin-top: 2px; }
  .nav-link { align-self: center; font-size: 13.5px; color: var(--acai); text-decoration: none; }

  main { padding: 24px 40px 140px; max-width: 1360px; }

  .controls { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--ink-soft); }
  .field select { font-family: inherit; font-size: 13.5px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .toggle-group { display: flex; gap: 4px; background: #F0EDE8; padding: 4px; border-radius: 10px; }
  .toggle-group button { border: none; background: transparent; padding: 7px 14px; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink-soft); border-radius: 7px; cursor: pointer; }
  .toggle-group button.active { background: var(--card); color: var(--acai); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .spacer { flex: 1; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-ghost { background: var(--bg); border: 1px solid var(--border); color: var(--acai); padding: 8px 13px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-ghost:hover { background: #F0EDE8; }
  .btn-danger { background: var(--rust-bg); border: 1px solid var(--rust); color: var(--rust); padding: 8px 13px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-danger:hover { background: #F7DAD3; }
  input[type="file"] { display: none; }
  .bulk-bar { display: flex; align-items: center; gap: 12px; background: var(--rust-bg); border: 1px solid var(--rust); border-radius: 10px; padding: 10px 16px; margin-bottom: 16px; font-size: 13px; color: var(--rust); }
  .acct-select { margin-right: 8px; accent-color: var(--acai); vertical-align: middle; }
  .edit-line { color: var(--acai-soft); cursor: pointer; font-size: 12px; margin-left: 6px; opacity: .6; }
  .edit-line:hover { opacity: 1; }

  .bank-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; margin-bottom: 20px; display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
  .bank-panel .current { flex: 1; min-width: 220px; }
  .bank-panel .current .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .bank-panel .current .amount { font-family: 'Fraunces', serif; font-size: 22px; }
  .bank-panel .current .meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .bank-panel input[type="date"], .bank-panel input.amount-input { font-family: inherit; font-size: 13.5px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .bank-panel input.amount-input { width: 160px; text-align: left; }
  .bank-panel button.bank-save { background: var(--acai); color: #fff; border: none; padding: 9px 18px; border-radius: 8px; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; }

  .add-category { margin-bottom: 14px; }

  section.group { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .group-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; cursor: pointer; user-select: none; gap: 10px; }
  .group-header h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 15.5px; margin: 0; }
  .group-header .hint { font-size: 12px; color: var(--ink-soft); flex: 1; }
  .group-header button.add-line { background: var(--mint-bg); color: var(--mint); border: none; padding: 5px 11px; border-radius: 6px; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .group-body { border-top: 1px solid var(--border); overflow-x: auto; }
  .group-body.collapsed { display: none; }

  table.year-grid { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
  table.year-grid th, table.year-grid td { border-bottom: 1px solid var(--border); padding: 5px 6px; white-space: nowrap; }
  table.year-grid thead th { color: var(--ink-soft); font-weight: 500; font-size: 11px; text-align: right; padding-top: 10px; padding-bottom: 8px; }
  table.year-grid thead th:first-child, table.year-grid thead th:nth-child(2), table.year-grid thead th:nth-child(3) { text-align: left; }
  table.year-grid td.acct-name { font-size: 12.5px; vertical-align: top; padding-top: 8px; max-width: 190px; white-space: normal; }
  table.year-grid td.currency-cell { vertical-align: top; padding-top: 6px; }
  table.year-grid td.currency-cell select { font-family: inherit; font-size: 11.5px; padding: 3px 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); }
  table.year-grid td.type-label { color: var(--ink-soft); font-size: 11px; }
  tr.row-real td.type-label { color: var(--acai); }
  tr.row-real { background: var(--real-bg); }
  tr.row-proj { background: var(--proj-bg); }
  table.year-grid input.amount-input { width: 78px; text-align: right; font-family: inherit; font-feature-settings: "tnum" 1; font-size: 12px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; background: #fff; color: var(--ink); }
  table.year-grid input.amount-input:focus { outline: 2px solid var(--acai-soft); outline-offset: -1px; }
  .diff-cell { text-align: right; font-size: 11.5px; }
  .diff-cell.pos { color: var(--mint); }
  .diff-cell.neg { color: var(--rust); }
  tr.subtotal-row td { font-weight: 600; background: #F0EDE8; }
  tr.subtotal-row td.type-label { font-weight: 500; }

  .grand-total { background: var(--acai); color: #fff; border-radius: 12px; padding: 18px 22px; margin-bottom: 20px; overflow-x: auto; }
  .grand-total h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 15.5px; margin: 0 0 10px; color: #fff; }
  table.grand-grid { border-collapse: collapse; font-size: 12.5px; color: #fff; min-width: 100%; }
  table.grand-grid td, table.grand-grid th { padding: 5px 8px; text-align: right; white-space: nowrap; }
  table.grand-grid th { color: #E7D9E3; font-weight: 500; font-size: 11px; }
  table.grand-grid td:first-child, table.grand-grid th:first-child { text-align: left; }

  .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; }
  .save-bar .status { font-size: 13px; color: var(--ink-soft); }
  .save-bar .status.ok { color: var(--mint); }
  .save-bar .status.err { color: var(--rust); }
  .save-bar button.save { background: var(--acai); color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .save-bar button.save:disabled { opacity: .5; cursor: default; }

  .loading, .empty-state { padding: 50px 0; text-align: center; color: var(--ink-soft); font-size: 13.5px; }

  @media (max-width: 760px) {
    header, main, .save-bar { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1>Carga anual</h1>
      <div class="subtitle">Real, proyectado y diferencia — categorías a tu medida</div>
    </div>
  </div>
  <a class="nav-link" href="index.html">← Volver al resumen</a>
</header>

<main id="main">
  <div class="loading">Cargando…</div>
</main>

<div class="save-bar" id="saveBar" style="display:none;">
  <span class="status" id="saveStatus"></span>
  <button class="save" id="saveBtn">Guardar cambios</button>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://dwxovleqwqmeqrjiyqyf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3eG92bGVxd3FtZXFyaml5cXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDQ0MDksImV4cCI6MjEwMzcyMDQwOX0.b76ZdNVFuG9fK_gQKPtZnNpEykFgv0uGA9B91RsKKgk';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'cashflow' } });

const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];
const TODAY = new Date();
const CURRENT_MONTH_KEY = `${TODAY.getFullYear()}-${String(TODAY.getMonth()+1).padStart(2,'0')}`;

let countries = [], categories = [], accounts = [];
let state = { countryId: null, year: TODAY.getFullYear(), displayCurrency: null };
let actuals = {}, projected = {}, rowCurrency = {};
let rates = {};
let latestBalance = null;
let selectedAccounts = new Set();

function fmt(n, currency) {
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(Math.round(n));
  const symbol = currency === 'USD' ? '$' : (currency === 'CRC' ? '₡' : (currency === 'GTQ' ? 'Q' : currency + ' '));
  return sign + symbol + abs.toLocaleString('es-CR');
}
function formatInputNumber(n) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '';
  return Number(n).toLocaleString('es-CR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function parseInputNumber(str) {
  if (str === null || str === undefined || str === '') return NaN;
  const cleaned = String(str).trim().replace(/\./g, '').replace(',', '.');
  return parseFloat(cleaned);
}
function attachAmountFormatting(inp) {
  inp.addEventListener('focus', () => {
    const n = parseInputNumber(inp.value);
    inp.value = isNaN(n) ? '' : String(n);
  });
  inp.addEventListener('blur', () => {
    const n = parseInputNumber(inp.value);
    inp.value = isNaN(n) ? '' : formatInputNumber(n);
  });
}
function getRate(currency, monthKey) {
  if (currency === state.displayCurrency) return 1;
  const table = rates[currency] || {};
  if (table[monthKey] !== undefined) return table[monthKey];
  const keys = Object.keys(table).sort();
  const past = keys.filter(k => k <= monthKey).pop();
  if (past) return table[past];
  return keys.length ? table[keys[0]] : 1;
}
function convert(amount, fromCurrency, monthKey) {
  if (fromCurrency === state.displayCurrency) return amount;
  const fromRate = getRate(fromCurrency, monthKey);
  const toRate = getRate(state.displayCurrency, monthKey);
  return (amount / fromRate) * toRate;
}
function currencyOptionsFor(country) {
  if (!country) return ['USD'];
  return country.currency_code === 'USD' ? ['USD'] : [country.currency_code, 'USD'];
}

async function init() {
  const { data: countryRows, error: cErr } = await sb.from('countries').select('id,name,currency_code').order('id');
  if (cErr) { renderError(cErr); return; }
  countries = countryRows;

  const { data: rateRows } = await sb.from('exchange_rates').select('currency_code,month,rate_to_usd');
  (rateRows || []).forEach(r => {
    const mk = r.month.slice(0,7);
    if (!rates[r.currency_code]) rates[r.currency_code] = {};
    rates[r.currency_code][mk] = Number(r.rate_to_usd);
  });

  state.countryId = countries[0]?.id;
  const country = countries.find(c => c.id === state.countryId);
  state.displayCurrency = country?.currency_code || 'CRC';

  renderShell();
  await loadCategoriesAndAccounts();
  await loadYearData();
  await loadBankBalance();
}

function renderError(err) { document.getElementById('main').innerHTML = `<div class="empty-state">No se pudo cargar: ${err.message || err}</div>`; }

function renderShell() {
  const years = [TODAY.getFullYear()-1, TODAY.getFullYear(), TODAY.getFullYear()+1];
  const country = countries.find(c => c.id === state.countryId);
  const curOpts = currencyOptionsFor(country);

  document.getElementById('main').innerHTML = `
    <div class="controls">
      <div class="field"><label>País</label>
        <select id="countrySelect">${countries.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Año</label>
        <select id="yearSelect">${years.map(y => `<option value="${y}" ${y===state.year?'selected':''}>${y}</option>`).join('')}</select>
      </div>
      ${curOpts.length > 1 ? `
      <div class="field"><label>Ver totales en</label>
        <div class="toggle-group" id="currencyToggle">
          ${curOpts.map(c => `<button data-cur="${c}" class="${c===state.displayCurrency?'active':''}">${c}</button>`).join('')}
        </div>
      </div>` : ''}
      <div class="spacer"></div>
      <div class="btn-row">
        <button class="btn-ghost" id="templateBtn">↓ Plantilla</button>
        <button class="btn-ghost" id="exportBtn">↓ Descargar Excel</button>
        <button class="btn-ghost" id="importBtn">↑ Importar datos</button>
        <input type="file" id="importFile" accept=".xlsx,.xls,.csv" />
      </div>
    </div>
    <div class="bulk-bar" id="bulkBar" style="display:none;">
      <span id="bulkCount"></span>
      <button class="btn-danger" id="bulkDeleteBtn">🗑 Eliminar seleccionadas</button>
      <button class="btn-ghost" id="bulkClearBtn">Cancelar selección</button>
    </div>
    <div class="bank-panel" id="bankPanel">
      <div class="current">
        <div class="label">Saldo de banco actual</div>
        <div class="amount" id="bankAmount">—</div>
        <div class="meta" id="bankMeta">Sin registrar</div>
      </div>
      <div class="field"><label>Fecha</label><input type="date" id="bankDate" value="${TODAY.toISOString().slice(0,10)}"/></div>
      <div class="field"><label>Nuevo saldo</label><input type="text" inputmode="decimal" class="amount-input" id="bankAmountInput" placeholder="0"/></div>
      <button class="bank-save" id="bankSaveBtn">Actualizar saldo</button>
    </div>
    <div class="add-category"><button class="btn-ghost" id="addCategoryBtn">+ Agregar categoría</button></div>
    <div id="gridArea"></div>
    <div id="grandTotalArea"></div>
  `;

  document.getElementById('countrySelect').addEventListener('change', async e => {
    state.countryId = Number(e.target.value);
    const c = countries.find(x => x.id === state.countryId);
    state.displayCurrency = c?.currency_code || 'USD';
    selectedAccounts.clear();
    renderShell();
    await loadCategoriesAndAccounts();
    await loadYearData();
    await loadBankBalance();
  });
  document.getElementById('yearSelect').addEventListener('change', e => { state.year = Number(e.target.value); loadYearData(); });
  const toggle = document.getElementById('currencyToggle');
  if (toggle) toggle.addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    state.displayCurrency = btn.dataset.cur;
    toggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    renderGrid();
  });
  document.getElementById('bankSaveBtn').addEventListener('click', saveBankBalance);
  attachAmountFormatting(document.getElementById('bankAmountInput'));
  document.getElementById('addCategoryBtn').addEventListener('click', addCategory);
  document.getElementById('templateBtn').addEventListener('click', () => downloadWorkbook(false));
  document.getElementById('exportBtn').addEventListener('click', () => downloadWorkbook(true));
  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', handleImport);
  document.getElementById('bulkDeleteBtn').addEventListener('click', bulkDeleteSelected);
  document.getElementById('bulkClearBtn').addEventListener('click', () => { selectedAccounts.clear(); document.querySelectorAll('input.acct-select').forEach(cb => cb.checked = false); updateBulkBar(); });
}

async function loadCategoriesAndAccounts() {
  const { data: catRows, error: catErr } = await sb.from('categories').select('id,name,sort_order').eq('country_id', state.countryId).order('sort_order');
  if (catErr) { renderError(catErr); return; }
  categories = catRows;

  if (!categories.length) { accounts = []; renderGrid(); return; }
  const catIds = categories.map(c => c.id);
  const { data: acctRows, error: aErr } = await sb.from('accounts')
    .select('id,name,default_currency_code,category_id')
    .eq('active', true).in('category_id', catIds).order('name');
  if (aErr) { renderError(aErr); return; }
  accounts = acctRows;
}

async function loadBankBalance() {
  const { data, error } = await sb.from('cash_position').select('balance,currency_code,recorded_at')
    .eq('country_id', state.countryId).order('recorded_at', { ascending: false }).limit(1);
  if (error || !data || !data.length) {
    latestBalance = null;
    document.getElementById('bankAmount').textContent = '—';
    document.getElementById('bankMeta').textContent = 'Sin registrar';
    return;
  }
  latestBalance = data[0];
  document.getElementById('bankAmount').textContent = fmt(Number(latestBalance.balance), latestBalance.currency_code);
  document.getElementById('bankMeta').textContent = `Actualizado ${latestBalance.recorded_at}`;
}

async function saveBankBalance() {
  const btn = document.getElementById('bankSaveBtn');
  const dateVal = document.getElementById('bankDate').value;
  const amountVal = parseInputNumber(document.getElementById('bankAmountInput').value);
  if (isNaN(amountVal)) return;
  const country = countries.find(c => c.id === state.countryId);
  btn.disabled = true;
  const { error } = await sb.from('cash_position').insert({ country_id: state.countryId, recorded_at: dateVal, balance: amountVal, currency_code: country.currency_code });
  btn.disabled = false;
  if (!error) { document.getElementById('bankAmountInput').value = ''; loadBankBalance(); }
  else alert('Error guardando saldo: ' + error.message);
}

async function addCategory() {
  const name = prompt('Nombre de la nueva categoría:');
  if (!name) return;
  const maxOrder = categories.reduce((m,c) => Math.max(m, c.sort_order), 0);
  const { error } = await sb.from('categories').insert({ country_id: state.countryId, name, sort_order: maxOrder + 1 });
  if (error) { alert('Error: ' + error.message); return; }
  await loadCategoriesAndAccounts();
  await loadYearData();
}

async function addLine(categoryId) {
  const name = prompt('Nombre de la nueva línea/cuenta:');
  if (!name) return;
  const country = countries.find(c => c.id === state.countryId);
  const { error } = await sb.from('accounts').insert({ name, category_id: categoryId, active: true, default_currency_code: country.currency_code });
  if (error) { alert('Error: ' + error.message); return; }
  await loadCategoriesAndAccounts();
  renderGrid();
}

function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const count = selectedAccounts.size;
  if (count === 0) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  document.getElementById('bulkCount').textContent = `${count} cuenta${count===1?'':'s'} seleccionada${count===1?'':'s'}`;
}

async function editAccountName(accountId, currentName) {
  const newName = prompt('Nuevo nombre de la cuenta:', currentName);
  if (!newName || newName.trim() === '' || newName === currentName) return;
  const { error } = await sb.from('accounts').update({ name: newName.trim() }).eq('id', accountId);
  if (error) { alert('Error: ' + error.message); return; }
  await loadCategoriesAndAccounts();
  renderGrid();
}

async function bulkDeleteSelected() {
  const ids = Array.from(selectedAccounts);
  if (!ids.length) return;
  if (!confirm(`¿Quitar ${ids.length} cuenta(s)? Los datos ya guardados no se borran, solo dejan de aparecer en la cuadrícula.`)) return;
  const { error } = await sb.from('accounts').update({ active: false }).in('id', ids);
  if (error) { alert('Error: ' + error.message); return; }
  selectedAccounts.clear();
  updateBulkBar();
  await loadCategoriesAndAccounts();
  await loadYearData();
}

async function loadYearData() {
  const gridArea = document.getElementById('gridArea');
  gridArea.innerHTML = `<div class="loading">Cargando datos del año…</div>`;
  document.getElementById('saveBar').style.display = 'none';

  if (!categories.length) {
    gridArea.innerHTML = `<div class="empty-state">Este país todavía no tiene categorías. Usa "+ Agregar categoría" para empezar.</div>`;
    return;
  }

  const start = `${state.year}-01-01`, end = `${state.year}-12-31`;
  const [{ data: actRows, error: actErr }, { data: projRows, error: projErr }] = await Promise.all([
    sb.from('cash_flow_actual').select('account_id,month,amount,currency_code').eq('country_id', state.countryId).gte('month', start).lte('month', end),
    sb.from('cash_flow_projected').select('account_id,month,amount,currency_code').eq('country_id', state.countryId).gte('month', start).lte('month', end)
  ]);
  if (actErr || projErr) { gridArea.innerHTML = `<div class="empty-state">Error: ${(actErr||projErr).message}</div>`; return; }

  actuals = {}; projected = {}; rowCurrency = {};
  (actRows || []).forEach(r => {
    const mk = r.month.slice(0,7);
    if (!actuals[r.account_id]) actuals[r.account_id] = {};
    actuals[r.account_id][mk] = { amount: Number(r.amount), currency_code: r.currency_code };
    if (r.currency_code && !rowCurrency[r.account_id]) rowCurrency[r.account_id] = r.currency_code;
  });
  (projRows || []).forEach(r => {
    const mk = r.month.slice(0,7);
    if (!projected[r.account_id]) projected[r.account_id] = {};
    projected[r.account_id][mk] = { amount: Number(r.amount), currency_code: r.currency_code };
    if (r.currency_code && !rowCurrency[r.account_id]) rowCurrency[r.account_id] = r.currency_code;
  });

  renderGrid();
}

function renderGrid() {
  const gridArea = document.getElementById('gridArea');
  const country = countries.find(c => c.id === state.countryId);
  const curOpts = currencyOptionsFor(country);

  if (!categories.length) {
    gridArea.innerHTML = `<div class="empty-state">Este país todavía no tiene categorías. Usa "+ Agregar categoría" para empezar.</div>`;
    document.getElementById('grandTotalArea').innerHTML = '';
    return;
  }

  gridArea.innerHTML = categories.map(cat => {
    const catAccounts = accounts.filter(a => a.category_id === cat.id);
    return `
    <section class="group" data-category-id="${cat.id}">
      <div class="group-header">
        <h2>${cat.name}</h2>
        <span class="hint">${catAccounts.length} línea${catAccounts.length===1?'':'s'}</span>
        <button class="add-line" data-add-line="${cat.id}">+ Agregar línea</button>
      </div>
      <div class="group-body collapsed">
        <table class="year-grid" data-category-table="${cat.id}">
          <thead><tr><th>Cuenta</th><th>Moneda</th><th></th>${MONTHS_ES.map(m => `<th>${m}</th>`).join('')}</tr></thead>
          <tbody>
            ${catAccounts.map(a => acctRowsHtml(a, curOpts)).join('')}
            <tr class="subtotal-row row-real"><td colspan="2"></td><td class="type-label">Total real</td>${MONTHS_ES.map((m,i) => `<td class="subtotal-cell" data-kind="real" data-mi="${i}"></td>`).join('')}</tr>
            <tr class="subtotal-row row-proj"><td colspan="2"></td><td class="type-label">Total proyectado</td>${MONTHS_ES.map((m,i) => `<td class="subtotal-cell" data-kind="proj" data-mi="${i}"></td>`).join('')}</tr>
            <tr class="subtotal-row row-diff"><td colspan="2"></td><td class="type-label">Diferencia</td>${MONTHS_ES.map((m,i) => `<td class="subtotal-cell diff-cell" data-kind="diff" data-mi="${i}"></td>`).join('')}</tr>
          </tbody>
        </table>
      </div>
    </section>
  `; }).join('');

  gridArea.querySelectorAll('.group-header').forEach(h => {
    h.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      h.nextElementSibling.classList.toggle('collapsed');
      recalcCategory(h.nextElementSibling.querySelector('table').dataset.categoryTable);
    });
  });
  gridArea.querySelectorAll('button.add-line').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); addLine(Number(b.dataset.addLine)); }));
  gridArea.querySelectorAll('input.acct-select').forEach(cb => {
    cb.checked = selectedAccounts.has(Number(cb.dataset.accountId));
    cb.addEventListener('click', (e) => e.stopPropagation());
    cb.addEventListener('change', () => {
      const id = Number(cb.dataset.accountId);
      if (cb.checked) selectedAccounts.add(id); else selectedAccounts.delete(id);
      updateBulkBar();
    });
  });
  gridArea.querySelectorAll('.edit-line').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); editAccountName(Number(b.dataset.editLine), b.dataset.currentName); }));
  gridArea.querySelectorAll('input[type="text"].amount-input').forEach(inp => {
    attachAmountFormatting(inp);
    inp.addEventListener('input', () => {
      const catId = inp.closest('table').dataset.categoryTable;
      updateDiffCell(inp);
      recalcCategory(catId);
      recalcGrandTotal();
    });
  });
  gridArea.querySelectorAll('select.acct-currency').forEach(sel => {
    sel.addEventListener('change', () => {
      rowCurrency[sel.dataset.accountId] = sel.value;
      const catId = sel.closest('table').dataset.categoryTable;
      recalcCategory(catId); recalcGrandTotal();
    });
  });

  categories.forEach(cat => recalcCategory(String(cat.id)));
  renderGrandTotalShell();
  recalcGrandTotal();

  document.getElementById('saveBar').style.display = 'flex';
  document.getElementById('saveStatus').textContent = '';
  document.getElementById('saveStatus').className = 'status';
}

function acctRowsHtml(a, curOpts) {
  const cur = rowCurrency[a.id] || a.default_currency_code || curOpts[0];
  const realVals = actuals[a.id] || {}, projVals = projected[a.id] || {};
  const monthCells = (vals, cls) => MONTHS_ES.map((m, i) => {
    const mk = `${state.year}-${String(i+1).padStart(2,'0')}`;
    const v = vals[mk];
    return `<td><input type="text" inputmode="decimal" class="${cls} amount-input" placeholder="0" data-account-id="${a.id}" data-month="${mk}" value="${v !== undefined ? formatInputNumber(v.amount) : ''}"/></td>`;
  }).join('');
  const diffCells = MONTHS_ES.map((m,i) => {
    const mk = `${state.year}-${String(i+1).padStart(2,'0')}`;
    const r = realVals[mk]?.amount, p = projVals[mk]?.amount;
    const d = (r !== undefined && p !== undefined) ? (r - p) : null;
    return `<td class="diff-cell" data-account-id="${a.id}" data-month="${mk}">${d !== null ? fmt(d, cur) : '—'}</td>`;
  }).join('');
  const curSelect = curOpts.length > 1
    ? `<select class="acct-currency" data-account-id="${a.id}">${curOpts.map(c => `<option value="${c}" ${c===cur?'selected':''}>${c}</option>`).join('')}</select>`
    : `<span>${cur}</span>`;
  return `
    <tr class="row-real"><td class="acct-name" rowspan="3"><input type="checkbox" class="acct-select" data-account-id="${a.id}"/>${a.name}<span class="edit-line" data-edit-line="${a.id}" data-current-name="${a.name.replace(/"/g,'&quot;')}">✎</span></td><td class="currency-cell" rowspan="3">${curSelect}</td><td class="type-label">Real</td>${monthCells(realVals,'real-input')}</tr>
    <tr class="row-proj"><td class="type-label">Proyectado</td>${monthCells(projVals,'proj-input')}</tr>
    <tr class="row-diff"><td class="type-label">Diferencia</td>${diffCells}</tr>
  `;
}

function accountCurrency(accountId) {
  return rowCurrency[accountId] || (accounts.find(a=>a.id==accountId)||{}).default_currency_code || state.displayCurrency;
}

function updateDiffCell(inp) {
  const accountId = inp.dataset.accountId, mk = inp.dataset.month;
  const table = inp.closest('table');
  const cell = table.querySelector(`.diff-cell[data-account-id="${accountId}"][data-month="${mk}"]`);
  if (!cell) return;
  const realInput = table.querySelector(`input.real-input[data-account-id="${accountId}"][data-month="${mk}"]`);
  const projInput = table.querySelector(`input.proj-input[data-account-id="${accountId}"][data-month="${mk}"]`);
  const r = realInput.value !== '' ? parseInputNumber(realInput.value) : null;
  const p = projInput.value !== '' ? parseInputNumber(projInput.value) : null;
  const cur = accountCurrency(accountId);
  if (r !== null && p !== null) {
    const d = r - p;
    cell.textContent = fmt(d, cur);
    cell.classList.toggle('pos', d >= 0); cell.classList.toggle('neg', d < 0);
  } else { cell.textContent = '—'; cell.classList.remove('pos','neg'); }
}

function categoryMonthlyTotals(catId) {
  const table = document.querySelector(`table[data-category-table="${catId}"]`);
  const totals = { real: Array(12).fill(0), proj: Array(12).fill(0) };
  if (!table) return totals;
  MONTHS_ES.forEach((m, i) => {
    const mk = `${state.year}-${String(i+1).padStart(2,'0')}`;
    table.querySelectorAll(`input.real-input[data-month="${mk}"]`).forEach(inp => {
      if (inp.value === '') return;
      totals.real[i] += convert(parseInputNumber(inp.value), accountCurrency(inp.dataset.accountId), mk);
    });
    table.querySelectorAll(`input.proj-input[data-month="${mk}"]`).forEach(inp => {
      if (inp.value === '') return;
      totals.proj[i] += convert(parseInputNumber(inp.value), accountCurrency(inp.dataset.accountId), mk);
    });
  });
  return totals;
}

function recalcCategory(catId) {
  const table = document.querySelector(`table[data-category-table="${catId}"]`);
  if (!table) return;
  const totals = categoryMonthlyTotals(catId);
  MONTHS_ES.forEach((m, i) => {
    const realCell = table.querySelector(`.subtotal-cell[data-kind="real"][data-mi="${i}"]`);
    const projCell = table.querySelector(`.subtotal-cell[data-kind="proj"][data-mi="${i}"]`);
    const diffCell = table.querySelector(`.subtotal-cell[data-kind="diff"][data-mi="${i}"]`);
    if (realCell) realCell.textContent = fmt(totals.real[i], state.displayCurrency);
    if (projCell) projCell.textContent = fmt(totals.proj[i], state.displayCurrency);
    if (diffCell) {
      const d = totals.real[i] - totals.proj[i];
      diffCell.textContent = fmt(d, state.displayCurrency);
      diffCell.classList.toggle('pos', d >= 0); diffCell.classList.toggle('neg', d < 0);
    }
  });
}

function renderGrandTotalShell() {
  document.getElementById('grandTotalArea').innerHTML = `
    <div class="grand-total">
      <h2>Total general y flujo acumulado</h2>
      <table class="grand-grid">
        <thead><tr><th></th>${MONTHS_ES.map(m => `<th>${m}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td>Total real</td>${MONTHS_ES.map((m,i) => `<td data-grand="real" data-mi="${i}"></td>`).join('')}</tr>
          <tr><td>Total proyectado</td>${MONTHS_ES.map((m,i) => `<td data-grand="proj" data-mi="${i}"></td>`).join('')}</tr>
          <tr><td>Flujo acumulado (real)</td>${MONTHS_ES.map((m,i) => `<td data-grand="cum" data-mi="${i}"></td>`).join('')}</tr>
        </tbody>
      </table>
    </div>
  `;
}

function recalcGrandTotal() {
  const realTotals = Array(12).fill(0), projTotals = Array(12).fill(0);
  categories.forEach(cat => {
    const t = categoryMonthlyTotals(cat.id);
    t.real.forEach((v,i) => realTotals[i] += v);
    t.proj.forEach((v,i) => projTotals[i] += v);
  });
  let cum = 0;
  MONTHS_ES.forEach((m,i) => {
    cum += realTotals[i];
    const realCell = document.querySelector(`[data-grand="real"][data-mi="${i}"]`);
    const projCell = document.querySelector(`[data-grand="proj"][data-mi="${i}"]`);
    const cumCell = document.querySelector(`[data-grand="cum"][data-mi="${i}"]`);
    if (realCell) realCell.textContent = fmt(realTotals[i], state.displayCurrency);
    if (projCell) projCell.textContent = fmt(projTotals[i], state.displayCurrency);
    if (cumCell) cumCell.textContent = fmt(cum, state.displayCurrency);
  });
}

// ---- Import / Export ----
function downloadWorkbook(withData) {
  const rows = [];
  categories.forEach(cat => {
    accounts.filter(a => a.category_id === cat.id).forEach(a => {
      const cur = rowCurrency[a.id] || a.default_currency_code;
      ['Real','Proyectado'].forEach(tipo => {
        const row = { Categoria: cat.name, Cuenta: a.name, Moneda: cur, Tipo: tipo, Año: state.year };
        MONTHS_ES.forEach((m, i) => {
          const mk = `${state.year}-${String(i+1).padStart(2,'0')}`;
          const src = tipo === 'Real' ? actuals[a.id] : projected[a.id];
          row[m] = withData && src && src[mk] !== undefined ? src[mk].amount : '';
        });
        rows.push(row);
      });
    });
  });
  const country = countries.find(c => c.id === state.countryId);
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Flujo de caja');
  XLSX.writeFile(wb, `oakberry-flujo-${country?.name || ''}-${state.year}${withData ? '' : '-plantilla'}.xlsx`);
}

async function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Leyendo archivo…'; statusEl.className = 'status';

  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws);

  const country = countries.find(c => c.id === state.countryId);
  const catCache = {}; categories.forEach(c => catCache[c.name] = c.id);
  const acctCache = {}; accounts.forEach(a => acctCache[`${a.category_id}::${a.name}`] = a);

  const actualRows = [], projectedRows = [];
  let maxOrder = categories.reduce((m,c) => Math.max(m, c.sort_order), 0);

  for (const row of rows) {
    const catName = String(row['Categoria'] || '').trim();
    const acctName = String(row['Cuenta'] || '').trim();
    const currency = String(row['Moneda'] || country.currency_code).trim();
    const tipo = String(row['Tipo'] || '').trim();
    const year = Number(row['Año']) || state.year;
    if (!catName || !acctName || !tipo) continue;

    let catId = catCache[catName];
    if (!catId) {
      const { data, error } = await sb.from('categories').insert({ country_id: state.countryId, name: catName, sort_order: ++maxOrder }).select().single();
      if (error) continue;
      catId = data.id; catCache[catName] = catId;
      categories.push(data);
    }
    let acct = acctCache[`${catId}::${acctName}`];
    if (!acct) {
      const { data, error } = await sb.from('accounts').insert({ name: acctName, category_id: catId, active: true, default_currency_code: currency }).select().single();
      if (error) continue;
      acct = data; acctCache[`${catId}::${acctName}`] = acct;
      accounts.push(acct);
    }

    MONTHS_ES.forEach((m, i) => {
      const val = row[m];
      if (val === undefined || val === '' || val === null) return;
      const mk = `${year}-${String(i+1).padStart(2,'0')}`;
      const entry = { account_id: acct.id, country_id: state.countryId, month: `${mk}-01`, amount: parseFloat(val), currency_code: currency };
      if (tipo === 'Real') { entry.is_partial_month = mk === CURRENT_MONTH_KEY; actualRows.push(entry); }
      else if (tipo === 'Proyectado') projectedRows.push(entry);
    });
  }

  let err = null;
  if (actualRows.length) { const { error } = await sb.from('cash_flow_actual').upsert(actualRows, { onConflict: 'account_id,country_id,month' }); if (error) err = error; }
  if (!err && projectedRows.length) { const { error } = await sb.from('cash_flow_projected').upsert(projectedRows, { onConflict: 'account_id,country_id,month' }); if (error) err = error; }

  e.target.value = '';
  if (err) { statusEl.textContent = 'Error importando: ' + err.message; statusEl.classList.add('err'); return; }
  statusEl.textContent = `Importado ✓ ${actualRows.length + projectedRows.length} valores`; statusEl.classList.add('ok');
  document.getElementById('saveBar').style.display = 'flex';
  await loadCategoriesAndAccounts();
  await loadYearData();
}

document.addEventListener('click', async (e) => {
  if (e.target.id !== 'saveBtn') return;
  const btn = e.target, statusEl = document.getElementById('saveStatus');
  btn.disabled = true; statusEl.className = 'status'; statusEl.textContent = 'Guardando…';

  const actualRows = [], projectedRows = [];
  document.querySelectorAll('input.real-input').forEach(inp => {
    if (inp.value === '') return;
    const accountId = Number(inp.dataset.accountId), mk = inp.dataset.month;
    actualRows.push({ account_id: accountId, country_id: state.countryId, month: `${mk}-01`, amount: parseInputNumber(inp.value), currency_code: accountCurrency(accountId), is_partial_month: mk === CURRENT_MONTH_KEY });
  });
  document.querySelectorAll('input.proj-input').forEach(inp => {
    if (inp.value === '') return;
    const accountId = Number(inp.dataset.accountId), mk = inp.dataset.month;
    projectedRows.push({ account_id: accountId, country_id: state.countryId, month: `${mk}-01`, amount: parseInputNumber(inp.value), currency_code: accountCurrency(accountId) });
  });

  if (!actualRows.length && !projectedRows.length) { statusEl.textContent = 'No hay valores para guardar'; statusEl.classList.add('err'); btn.disabled = false; return; }

  let err = null;
  if (actualRows.length) { const { error } = await sb.from('cash_flow_actual').upsert(actualRows, { onConflict: 'account_id,country_id,month' }); if (error) err = error; }
  if (!err && projectedRows.length) { const { error } = await sb.from('cash_flow_projected').upsert(projectedRows, { onConflict: 'account_id,country_id,month' }); if (error) err = error; }
  btn.disabled = false;
  if (err) { statusEl.textContent = 'Error: ' + err.message; statusEl.classList.add('err'); }
  else { statusEl.textContent = `Guardado ✓ ${actualRows.length + projectedRows.length} valores`; statusEl.classList.add('ok'); }
});

init();
</script>
