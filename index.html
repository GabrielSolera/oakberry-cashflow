<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OakBerry Centroamérica · Flujo de Caja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF9F6; --ink: #221A2B; --ink-soft: #6B6274;
    --acai: #4A1942; --acai-soft: #7A4270;
    --mint: #2E7D53; --mint-bg: #E7F3EC;
    --rust: #B4402A; --rust-bg: #FBEBE7;
    --border: #E5E1DC; --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; font-feature-settings: "tnum" 1, "lnum" 1; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 36px 48px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 16px; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .mark { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, var(--acai-soft), var(--acai) 70%); flex-shrink: 0; }
  h1 { font-family: 'Fraunces', serif; font-optical-sizing: auto; font-weight: 500; font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .nav-link { font-size: 14px; color: var(--acai); text-decoration: none; }
  nav.countries { display: flex; gap: 4px; background: #F0EDE8; padding: 4px; border-radius: 10px; }
  nav.countries button, .toggle-group button { border: none; background: transparent; padding: 8px 16px; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink-soft); border-radius: 7px; cursor: pointer; transition: background .15s ease, color .15s ease; }
  nav.countries button.active, .toggle-group button.active { background: var(--card); color: var(--acai); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  nav.countries button:disabled { opacity: .4; cursor: default; }
  .toggle-group { display: flex; gap: 4px; background: #F0EDE8; padding: 4px; border-radius: 10px; }

  main { padding: 32px 48px 64px; max-width: 1180px; }

  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 32px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 20px; }
  .kpi .label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; }
  .kpi .value { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .kpi .value.neg { color: var(--rust); }
  .kpi .value.pos { color: var(--mint); }
  .kpi .sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }

  section.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px 26px 8px; margin-bottom: 24px; }
  section.panel h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 17px; margin: 0 0 18px; }

  .chart-wrap { overflow-x: auto; }
  svg.chart { display: block; }
  .chart-axis-label { font-size: 11px; fill: var(--ink-soft); font-family: 'IBM Plex Sans', sans-serif; }
  .legend { display: flex; gap: 20px; margin-bottom: 6px; font-size: 12.5px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
  th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--ink-soft); font-weight: 500; font-size: 11.5px; }
  tbody tr:last-child td { border-bottom: none; }
  .cell-stack .real { color: var(--ink); }
  .cell-stack .proj { color: var(--ink-soft); font-size: 11.5px; }
  td.month-partial { color: var(--ink-soft); }
  .partial-flag { font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .diff-pos { color: var(--mint); }
  .diff-neg { color: var(--rust); }

  .empty-state { padding: 48px 12px 56px; text-align: center; color: var(--ink-soft); }
  .empty-state .big { font-family: 'Fraunces', serif; font-size: 18px; color: var(--ink); margin-bottom: 6px; }
  .loading { padding: 60px 0; text-align: center; color: var(--ink-soft); font-size: 14px; }
  footer { padding: 0 48px 48px; color: var(--ink-soft); font-size: 12.5px; }

  @media (max-width: 760px) {
    header, main, footer { padding-left: 20px; padding-right: 20px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1>Flujo de caja · OakBerry Centroamérica</h1>
      <div class="subtitle">Proyectado vs. real, por país y mes</div>
    </div>
  </div>
  <div class="header-right">
    <a class="nav-link" href="carga.html">Carga anual →</a>
    <div id="currencyToggleWrap"></div>
    <nav class="countries" id="countryNav"></nav>
  </div>
</header>

<main id="main"><div class="loading">Cargando datos…</div></main>

<footer>Fuente: catálogo contable QuickBooks · datos reales cargados hasta agosto 2026 (parcial)</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://dwxovleqwqmeqrjiyqyf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3eG92bGVxd3FtZXFyaml5cXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDQ0MDksImV4cCI6MjEwMzcyMDQwOX0.b76ZdNVFuG9fK_gQKPtZnNpEykFgv0uGA9B91RsKKgk';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'cashflow' } });

const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];

let countries = [], accounts = {};
let actualsByCountry = {}, projectedByCountry = {};
let rates = {};
let bankByCountry = {};
let activeCountryId = null;
let displayCurrency = null;

function fmt(n, currency) {
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(Math.round(n));
  const symbol = currency === 'USD' ? '$' : (currency === 'CRC' ? '₡' : (currency === 'GTQ' ? 'Q' : currency + ' '));
  return sign + symbol + abs.toLocaleString('es-CR');
}

function getRate(currency, monthKey) {
  if (currency === displayCurrency) return 1;
  const table = rates[currency] || {};
  if (table[monthKey] !== undefined) return table[monthKey];
  const keys = Object.keys(table).sort();
  const past = keys.filter(k => k <= monthKey).pop();
  if (past) return table[past];
  return keys.length ? table[keys[0]] : 1;
}
function convert(amount, fromCurrency, monthKey) {
  if (fromCurrency === displayCurrency) return amount;
  const fromRate = getRate(fromCurrency, monthKey);
  const toRate = getRate(displayCurrency, monthKey);
  return (amount / fromRate) * toRate;
}
function currencyOptionsFor(country) {
  if (!country) return ['USD'];
  return country.currency_code === 'USD' ? ['USD'] : [country.currency_code, 'USD'];
}

async function load() {
  const { data: countryRows, error: cErr } = await sb.from('countries').select('id,name,currency_code').order('id');
  if (cErr) { renderError(cErr); return; }
  countries = countryRows;

  const { data: acctRows, error: acErr } = await sb.from('accounts').select('id,section,default_currency_code');
  if (acErr) { renderError(acErr); return; }
  acctRows.forEach(a => accounts[a.id] = a);

  const { data: rateRows } = await sb.from('exchange_rates').select('currency_code,month,rate_to_usd');
  (rateRows || []).forEach(r => {
    const mk = r.month.slice(0,7);
    if (!rates[r.currency_code]) rates[r.currency_code] = {};
    rates[r.currency_code][mk] = Number(r.rate_to_usd);
  });

  const [{ data: actRows, error: aErr }, { data: projRows, error: pErr }] = await Promise.all([
    sb.from('cash_flow_actual').select('amount,month,is_partial_month,country_id,account_id,currency_code'),
    sb.from('cash_flow_projected').select('amount,month,country_id,account_id,currency_code')
  ]);
  if (aErr || pErr) { renderError(aErr || pErr); return; }

  actualsByCountry = {}; projectedByCountry = {};
  for (const c of countries) { actualsByCountry[c.id] = []; projectedByCountry[c.id] = []; }
  (actRows || []).forEach(r => {
    if (!actualsByCountry[r.country_id]) actualsByCountry[r.country_id] = [];
    actualsByCountry[r.country_id].push({ month: r.month.slice(0,7), amount: Number(r.amount), section: accounts[r.account_id]?.section, partial: r.is_partial_month, currency: r.currency_code || accounts[r.account_id]?.default_currency_code });
  });
  (projRows || []).forEach(r => {
    if (!projectedByCountry[r.country_id]) projectedByCountry[r.country_id] = [];
    projectedByCountry[r.country_id].push({ month: r.month.slice(0,7), amount: Number(r.amount), section: accounts[r.account_id]?.section, currency: r.currency_code || accounts[r.account_id]?.default_currency_code });
  });

  const { data: bankRows } = await sb.from('cash_position').select('country_id,balance,currency_code,recorded_at').order('recorded_at', { ascending: false });
  bankByCountry = {};
  (bankRows || []).forEach(r => { if (!bankByCountry[r.country_id]) bankByCountry[r.country_id] = r; });

  activeCountryId = countries.find(c => actualsByCountry[c.id]?.length)?.id ?? countries[0]?.id;
  const country = countries.find(c => c.id === activeCountryId);
  displayCurrency = country?.currency_code || 'CRC';

  renderNav();
  renderCurrencyToggle();
  renderCountry(activeCountryId);
}

function renderError(err) {
  document.getElementById('main').innerHTML = `<div class="empty-state"><div class="big">No se pudo cargar la información</div><div>${err.message || err}</div></div>`;
}

function renderNav() {
  const nav = document.getElementById('countryNav');
  nav.innerHTML = '';
  countries.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c.name;
    if (c.id === activeCountryId) btn.classList.add('active');
    btn.addEventListener('click', () => {
      activeCountryId = c.id;
      const country = countries.find(x => x.id === c.id);
      displayCurrency = country?.currency_code || 'USD';
      renderNav(); renderCurrencyToggle(); renderCountry(c.id);
    });
    nav.appendChild(btn);
  });
}

function renderCurrencyToggle() {
  const wrap = document.getElementById('currencyToggleWrap');
  const country = countries.find(c => c.id === activeCountryId);
  const opts = currencyOptionsFor(country);
  if (opts.length < 2) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<div class="toggle-group" id="curToggle">${opts.map(c => `<button data-cur="${c}" class="${c===displayCurrency?'active':''}">${c}</button>`).join('')}</div>`;
  document.getElementById('curToggle').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    displayCurrency = btn.dataset.cur;
    renderCurrencyToggle();
    renderCountry(activeCountryId);
  });
}

function aggregateByMonth(rows) {
  const monthMap = {};
  for (const r of rows) {
    if (!monthMap[r.month]) monthMap[r.month] = { income: 0, cogs: 0, expense: 0, other_income: 0, other_expense: 0, partial: false };
    const bucket = monthMap[r.month];
    const converted = convert(r.amount, r.currency || displayCurrency, r.month);
    if (r.section === 'income') bucket.income += converted;
    else if (r.section === 'cogs') bucket.cogs += converted;
    else if (r.section === 'expense') bucket.expense += converted;
    else if (r.section === 'other_income') bucket.other_income += converted;
    else if (r.section === 'other_expense') bucket.other_expense += converted;
    if (r.partial) bucket.partial = true;
  }
  return monthMap;
}

function renderCountry(countryId) {
  const country = countries.find(c => c.id === countryId);
  const actualRows = actualsByCountry[countryId] || [];
  const projRows = projectedByCountry[countryId] || [];
  const main = document.getElementById('main');

  if (!actualRows.length && !projRows.length) {
    main.innerHTML = `<div class="empty-state"><div class="big">Todavía no hay datos cargados para ${country.name}</div><div>En cuanto tengas el reporte contable de este país, lo cargamos igual que se hizo con Costa Rica.</div></div>`;
    return;
  }

  const actualByMonth = aggregateByMonth(actualRows);
  const projByMonth = aggregateByMonth(projRows);
  const allMonths = Array.from(new Set([...Object.keys(actualByMonth), ...Object.keys(projByMonth)])).sort();

  const netOf = (b) => (b.income + b.other_income) - b.cogs - b.expense - b.other_expense;

  const totalIncome = allMonths.reduce((s,m) => s + (actualByMonth[m] ? actualByMonth[m].income + actualByMonth[m].other_income : 0), 0);
  const totalCogs = allMonths.reduce((s,m) => s + (actualByMonth[m]?.cogs || 0), 0);
  const totalExpense = allMonths.reduce((s,m) => s + (actualByMonth[m] ? actualByMonth[m].expense + actualByMonth[m].other_expense : 0), 0);
  const totalNet = totalIncome - totalCogs - totalExpense;

  const bank = bankByCountry[countryId];
  const bankDisplay = bank ? fmt(convert(Number(bank.balance), bank.currency_code, bank.recorded_at.slice(0,7)), displayCurrency) : '—';

  const cur = displayCurrency;

  main.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Ingresos reales</div><div class="value">${fmt(totalIncome, cur)}</div></div>
      <div class="kpi"><div class="label">Costo de ventas</div><div class="value">${fmt(totalCogs, cur)}</div></div>
      <div class="kpi"><div class="label">Gastos operativos</div><div class="value">${fmt(totalExpense, cur)}</div></div>
      <div class="kpi"><div class="label">Resultado neto</div><div class="value ${totalNet >= 0 ? 'pos' : 'neg'}">${fmt(totalNet, cur)}</div></div>
      <div class="kpi"><div class="label">Caja disponible</div><div class="value">${bankDisplay}</div><div class="sub">${bank ? 'Al ' + bank.recorded_at : 'Sin registrar'}</div></div>
    </div>

    <section class="panel">
      <h2>Ingresos vs. gastos reales por mes</h2>
      <div class="legend"><span><i style="background:var(--acai)"></i>Ingresos</span><span><i style="background:#D8CFE0"></i>Costo de ventas + gastos</span></div>
      <div class="chart-wrap" id="chartWrap"></div>
    </section>

    <section class="panel">
      <h2>Detalle mensual — real / proyectado</h2>
      <table>
        <thead><tr><th>Mes</th><th>Ingresos</th><th>Costo de ventas</th><th>Gastos</th><th>Neto</th><th>Diferencia neto</th></tr></thead>
        <tbody id="monthlyBody"></tbody>
      </table>
    </section>
  `;

  const tbody = document.getElementById('monthlyBody');
  allMonths.forEach(m => {
    const rb = actualByMonth[m] || { income:0, cogs:0, expense:0, other_income:0, other_expense:0, partial:false };
    const pb = projByMonth[m] || { income:0, cogs:0, expense:0, other_income:0, other_expense:0 };
    const rIncome = rb.income + rb.other_income, pIncome = pb.income + pb.other_income;
    const rExpense = rb.expense + rb.other_expense, pExpense = pb.expense + pb.other_expense;
    const rNet = netOf(rb), pNet = netOf(pb);
    const hasProj = projByMonth[m] !== undefined;
    const hasReal = actualByMonth[m] !== undefined;
    const diff = (hasReal && hasProj) ? (rNet - pNet) : null;
    const [y, mo] = m.split('-');
    const label = MONTHS_ES[parseInt(mo,10)-1] + ' ' + y;

    const stack = (realVal, projVal) => `<div class="cell-stack"><div class="real">${hasReal ? fmt(realVal, cur) : '—'}</div>${hasProj ? `<div class="proj">${fmt(projVal, cur)} proy.</div>` : ''}</div>`;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="${rb.partial ? 'month-partial' : ''}">${label}${rb.partial ? '<span class="partial-flag">parcial</span>' : ''}</td>
      <td>${stack(rIncome, pIncome)}</td>
      <td>${stack(rb.cogs, pb.cogs)}</td>
      <td>${stack(rExpense, pExpense)}</td>
      <td>${stack(rNet, pNet)}</td>
      <td class="${diff !== null ? (diff >= 0 ? 'diff-pos' : 'diff-neg') : ''}">${diff !== null ? fmt(diff, cur) : '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  renderChart(allMonths, actualByMonth);
}

function renderChart(months, monthMap) {
  const wrap = document.getElementById('chartWrap');
  const w = Math.max(560, months.length * 64), h = 200, padBottom = 28, barW = 20, groupW = w / months.length;
  const maxVal = Math.max(...months.map(m => {
    const b = monthMap[m] || { income:0, other_income:0, cogs:0, expense:0, other_expense:0 };
    return Math.max(b.income + b.other_income, b.cogs + b.expense + b.other_expense);
  })) || 1;
  const scale = (v) => (v / maxVal) * (h - padBottom - 10);
  let bars = '';
  months.forEach((m, i) => {
    const b = monthMap[m] || { income:0, other_income:0, cogs:0, expense:0, other_expense:0 };
    const income = b.income + b.other_income, spend = b.cogs + b.expense + b.other_expense;
    const cx = i * groupW + groupW / 2;
    const incomeH = scale(income), spendH = scale(spend);
    const [y, mo] = m.split('-');
    bars += `
      <rect fill="var(--acai)" x="${cx - barW - 2}" y="${h - padBottom - incomeH}" width="${barW}" height="${incomeH}" rx="2"></rect>
      <rect fill="#D8CFE0" x="${cx + 2}" y="${h - padBottom - spendH}" width="${barW}" height="${spendH}" rx="2"></rect>
      <text class="chart-axis-label" x="${cx}" y="${h - 8}" text-anchor="middle">${MONTHS_ES[parseInt(mo,10)-1]}</text>
    `;
  });
  wrap.innerHTML = `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}

load();
</script>

</body>
</html>
