<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OAKBERRY Centroamérica · Flujo de Caja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --bg: #F5F3F7; --ink: #1E1726; --ink-soft: #6B6274;
    --acai: #4A1942; --acai-soft: #7A4270; --acai-glow: #9C4E8C;
    --mint: #2E7D53; --mint-bg: #E7F3EC;
    --rust: #B4402A; --rust-bg: #FBEBE7;
    --border: #E5E1DC; --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; font-feature-settings: "tnum" 1, "lnum" 1;
    background: var(--bg);
    position: relative;
    min-height: 100vh;
  }

  /* --- decorative background: slow-moving gradient + faint cash-flow waveform --- */
  .bg-layer { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
  .bg-layer .mesh {
    position: absolute; inset: -20%;
    background:
      radial-gradient(circle at 15% 20%, rgba(74,25,66,0.10), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(46,125,83,0.09), transparent 42%),
      radial-gradient(circle at 75% 85%, rgba(156,78,140,0.10), transparent 45%),
      radial-gradient(circle at 20% 80%, rgba(46,125,83,0.07), transparent 40%);
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(-3%, 2%) scale(1.06); }
  }
  .bg-layer svg.waves { position: absolute; bottom: 0; left: 0; width: 100%; height: 260px; opacity: .5; }
  .bg-layer svg.waves path { animation: wave-shift 18s ease-in-out infinite; }
  .bg-layer svg.waves path.p2 { animation-duration: 24s; animation-delay: -4s; }
  @keyframes wave-shift {
    0%, 100% { transform: translateX(0) translateY(0); }
    50% { transform: translateX(-2%) translateY(6px); }
  }

  header { display: flex; align-items: baseline; justify-content: space-between; padding: 36px 48px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 16px; }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .mark { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(135deg, var(--acai-glow), var(--acai) 65%); flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(74,25,66,0.28); }
  .brand .mark svg { width: 19px; height: 19px; color: #fff; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 25px; margin: 0; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .nav-link { font-size: 14px; color: var(--acai); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
  .nav-link svg { width: 15px; height: 15px; }
  nav.countries { display: flex; gap: 4px; background: rgba(255,255,255,.6); backdrop-filter: blur(6px); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  nav.countries button, .toggle-group button { border: none; background: transparent; padding: 8px 16px; font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink-soft); border-radius: 7px; cursor: pointer; transition: background .15s ease, color .15s ease; }
  nav.countries button.active, .toggle-group button.active { background: var(--card); color: var(--acai); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  nav.countries button:disabled { opacity: .4; cursor: default; }
  .toggle-group { display: flex; gap: 4px; background: rgba(255,255,255,.6); backdrop-filter: blur(6px); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }

  main { padding: 32px 48px 64px; max-width: 1180px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 32px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px; transition: transform .18s ease, box-shadow .18s ease; }
  .kpi:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(74,25,66,0.10); }
  .kpi .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .kpi .label svg { width: 14px; height: 14px; opacity: .7; }
  .kpi .value { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
  .kpi .value.neg { color: var(--rust); }
  .kpi .value.pos { color: var(--mint); }
  .kpi .sub { font-size: 11px; color: var(--ink-soft); margin-top: 6px; }
  .kpi.total { background: linear-gradient(135deg, var(--acai), #3A1434); border-color: var(--acai); }
  .kpi.total .label { color: #E7D9E3; }
  .kpi.total .value { color: #fff; }

  section.panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px 26px 8px; margin-bottom: 24px; overflow-x: auto; }
  section.panel h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  section.panel h2 svg { width: 17px; height: 17px; color: var(--acai); }

  .chart-wrap { overflow-x: auto; }
  svg.chart { display: block; }
  svg.chart rect { transition: height 1s cubic-bezier(.22,1,.36,1), y 1s cubic-bezier(.22,1,.36,1); }
  .chart-axis-label { font-size: 11px; fill: var(--ink-soft); font-family: 'IBM Plex Sans', sans-serif; }
  .legend { display: flex; gap: 20px; margin-bottom: 6px; font-size: 12.5px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }
  th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { color: var(--ink-soft); font-weight: 500; font-size: 11.5px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: #FAF7FA; }
  .cell-stack .real { color: var(--ink); }
  .cell-stack .proj { color: var(--ink-soft); font-size: 11.5px; }
  td.month-partial { color: var(--ink-soft); }
  .partial-flag { font-size: 10.5px; color: var(--ink-soft); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .diff-pos { color: var(--mint); }
  .diff-neg { color: var(--rust); }

  .empty-state { padding: 56px 12px 64px; text-align: center; color: var(--ink-soft); }
  .empty-state svg { width: 34px; height: 34px; color: var(--acai-soft); margin-bottom: 12px; }
  .empty-state .big { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; color: var(--ink); margin-bottom: 6px; }
  .loading { padding: 60px 0; text-align: center; color: var(--ink-soft); font-size: 14px; }
  footer { padding: 0 48px 48px; color: var(--ink-soft); font-size: 12.5px; }

  @media (max-width: 760px) {
    header, main, footer { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="mesh"></div>
  <svg class="waves" viewBox="0 0 1200 260" preserveAspectRatio="none">
    <path class="p1" d="M0,180 C150,140 300,220 450,180 C600,140 750,210 900,170 C1000,145 1100,175 1200,160 L1200,260 L0,260 Z" fill="#4A1942" opacity="0.06"></path>
    <path class="p2" d="M0,210 C180,170 320,230 480,200 C650,168 780,225 950,195 C1050,178 1120,200 1200,190 L1200,260 L0,260 Z" fill="#2E7D53" opacity="0.06"></path>
  </svg>
</div>

<header>
  <div class="brand">
    <span class="mark"><svg data-lucide="banknote"></svg></span>
    <div>
      <h1>Flujo de caja · OAKBERRY Centroamérica</h1>
      <div class="subtitle">Proyectado vs. real, por país y mes</div>
    </div>
  </div>
  <div class="header-right">
    <a class="nav-link" href="carga.html"><svg data-lucide="table-properties"></svg>Carga anual</a>
    <div id="currencyToggleWrap"></div>
    <nav class="countries" id="countryNav"></nav>
  </div>
</header>

<main id="main"><div class="loading">Cargando datos…</div></main>

<footer>Categorías y cuentas definidas por país · datos reales y proyectados capturados en la carga anual</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://dwxovleqwqmeqrjiyqyf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3eG92bGVxd3FtZXFyaml5cXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDQ0MDksImV4cCI6MjEwMzcyMDQwOX0.b76ZdNVFuG9fK_gQKPtZnNpEykFgv0uGA9B91RsKKgk';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'cashflow' } });

const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];

let countries = [], categoriesByCountry = {}, accountsById = {};
let actualRows = [], projectedRows = [];
let rates = {};
let bankByCountry = {};
let activeCountryId = null;
let displayCurrency = null;

function icons() { if (window.lucide) window.lucide.createIcons(); }

function fmt(n, currency) {
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(Math.round(n));
  const symbol = currency === 'USD' ? '$' : (currency === 'CRC' ? '₡' : (currency === 'GTQ' ? 'Q' : currency + ' '));
  return sign + symbol + abs.toLocaleString('es-CR');
}
function getRate(currency, monthKey) {
  if (currency === displayCurrency) return 1;
  const table = rates[currency] || {};
  if (table[monthKey] !== undefined) return table[monthKey];
  const keys = Object.keys(table).sort();
  const past = keys.filter(k => k <= monthKey).pop();
  if (past) return table[past];
  return keys.length ? table[keys[0]] : 1;
}
function convert(amount, fromCurrency, monthKey) {
  if (fromCurrency === displayCurrency) return amount;
  return (amount / getRate(fromCurrency, monthKey)) * getRate(displayCurrency, monthKey);
}
function currencyOptionsFor(country) {
  if (!country) return ['USD'];
  return country.currency_code === 'USD' ? ['USD'] : [country.currency_code, 'USD'];
}
function countUp(el, target, currency) {
  const start = 0, duration = 700, startTime = performance.now();
  function frame(now) {
    const p = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(start + (target - start) * eased, currency);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

async function load() {
  const { data: countryRows, error: cErr } = await sb.from('countries').select('id,name,currency_code').order('id');
  if (cErr) { renderError(cErr); return; }
  countries = countryRows;

  const { data: catRows, error: catErr } = await sb.from('categories').select('id,country_id,name,sort_order').eq('active', true).order('sort_order');
  if (catErr) { renderError(catErr); return; }
  categoriesByCountry = {};
  catRows.forEach(c => { if (!categoriesByCountry[c.country_id]) categoriesByCountry[c.country_id] = []; categoriesByCountry[c.country_id].push(c); });

  const { data: acctRows, error: aErr } = await sb.from('accounts').select('id,name,category_id,default_currency_code').eq('active', true);
  if (aErr) { renderError(aErr); return; }
  accountsById = {}; acctRows.forEach(a => accountsById[a.id] = a);

  const { data: rateRows } = await sb.from('exchange_rates').select('currency_code,month,rate_to_usd');
  (rateRows || []).forEach(r => {
    const mk = r.month.slice(0,7);
    if (!rates[r.currency_code]) rates[r.currency_code] = {};
    rates[r.currency_code][mk] = Number(r.rate_to_usd);
  });

  const [{ data: ar, error: aErr2 }, { data: pr, error: pErr2 }] = await Promise.all([
    sb.from('cash_flow_actual').select('amount,month,is_partial_month,country_id,account_id,currency_code'),
    sb.from('cash_flow_projected').select('amount,month,country_id,account_id,currency_code')
  ]);
  if (aErr2 || pErr2) { renderError(aErr2 || pErr2); return; }
  actualRows = ar || []; projectedRows = pr || [];

  const { data: bankRows } = await sb.from('cash_position').select('country_id,balance,currency_code,recorded_at').order('recorded_at', { ascending: false });
  bankByCountry = {};
  (bankRows || []).forEach(r => { if (!bankByCountry[r.country_id]) bankByCountry[r.country_id] = r; });

  activeCountryId = countries.find(c => actualRows.some(r => r.country_id === c.id))?.id ?? countries[0]?.id;
  const country = countries.find(c => c.id === activeCountryId);
  displayCurrency = country?.currency_code || 'CRC';

  renderNav(); renderCurrencyToggle(); renderCountry(activeCountryId);
  icons();
}

function renderError(err) { document.getElementById('main').innerHTML = `<div class="empty-state"><svg data-lucide="alert-triangle"></svg><div class="big">No se pudo cargar la información</div><div>${err.message || err}</div></div>`; icons(); }

function renderNav() {
  const nav = document.getElementById('countryNav');
  nav.innerHTML = '';
  countries.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c.name;
    if (c.id === activeCountryId) btn.classList.add('active');
    btn.addEventListener('click', () => {
      activeCountryId = c.id;
      const country = countries.find(x => x.id === c.id);
      displayCurrency = country?.currency_code || 'USD';
      renderNav(); renderCurrencyToggle(); renderCountry(c.id);
      icons();
    });
    nav.appendChild(btn);
  });
}

function renderCurrencyToggle() {
  const wrap = document.getElementById('currencyToggleWrap');
  const country = countries.find(c => c.id === activeCountryId);
  const opts = currencyOptionsFor(country);
  if (opts.length < 2) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<div class="toggle-group" id="curToggle">${opts.map(c => `<button data-cur="${c}" class="${c===displayCurrency?'active':''}">${c}</button>`).join('')}</div>`;
  document.getElementById('curToggle').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    displayCurrency = btn.dataset.cur;
    renderCurrencyToggle(); renderCountry(activeCountryId);
    icons();
  });
}

function renderCountry(countryId) {
  const country = countries.find(c => c.id === countryId);
  const cats = categoriesByCountry[countryId] || [];
  const actForCountry = actualRows.filter(r => r.country_id === countryId);
  const projForCountry = projectedRows.filter(r => r.country_id === countryId);
  const main = document.getElementById('main');

  if (!cats.length || (!actForCountry.length && !projForCountry.length)) {
    main.innerHTML = `<div class="empty-state"><svg data-lucide="inbox"></svg><div class="big">Todavía no hay datos cargados para ${country.name}</div><div>Ve a "Carga anual" para agregar categorías y cargar los primeros valores.</div></div>`;
    icons();
    return;
  }

  const catTotals = {}; cats.forEach(c => catTotals[c.id] = { real: 0, proj: 0 });
  const monthReal = {}, monthProj = {}, monthPartial = {};

  actForCountry.forEach(r => {
    const acct = accountsById[r.account_id]; if (!acct) return;
    const mk = r.month.slice(0,7);
    const converted = convert(Number(r.amount), r.currency_code || acct.default_currency_code, mk);
    if (catTotals[acct.category_id]) catTotals[acct.category_id].real += converted;
    monthReal[mk] = (monthReal[mk] || 0) + converted;
    if (r.is_partial_month) monthPartial[mk] = true;
  });
  projForCountry.forEach(r => {
    const acct = accountsById[r.account_id]; if (!acct) return;
    const mk = r.month.slice(0,7);
    const converted = convert(Number(r.amount), r.currency_code || acct.default_currency_code, mk);
    if (catTotals[acct.category_id]) catTotals[acct.category_id].proj += converted;
    monthProj[mk] = (monthProj[mk] || 0) + converted;
  });

  const totalReal = Object.values(catTotals).reduce((s,c) => s + c.real, 0);
  const totalProj = Object.values(catTotals).reduce((s,c) => s + c.proj, 0);

  const bank = bankByCountry[countryId];
  const bankAmount = bank ? convert(Number(bank.balance), bank.currency_code, bank.recorded_at.slice(0,7)) : null;
  const cur = displayCurrency;

  const kpiCards = cats.map(c => `
    <div class="kpi"><div class="label"><svg data-lucide="layers"></svg>${c.name}</div><div class="value ${catTotals[c.id].real >= 0 ? '' : 'neg'}" data-countup="${catTotals[c.id].real}" data-cur="${cur}">${fmt(0, cur)}</div><div class="sub">Proy. ${fmt(catTotals[c.id].proj, cur)}</div></div>
  `).join('');

  main.innerHTML = `
    <div class="kpis">
      ${kpiCards}
      <div class="kpi total"><div class="label"><svg data-lucide="trending-up"></svg>Flujo neto (real)</div><div class="value" data-countup="${totalReal}" data-cur="${cur}">${fmt(0, cur)}</div><div class="sub" style="color:#E7D9E3;">Proy. ${fmt(totalProj, cur)}</div></div>
      <div class="kpi"><div class="label"><svg data-lucide="wallet"></svg>Caja disponible</div><div class="value" data-countup="${bankAmount ?? 0}" data-cur="${cur}">${fmt(0, cur)}</div><div class="sub">${bank ? 'Al ' + bank.recorded_at : 'Sin registrar'}</div></div>
    </div>

    <section class="panel">
      <h2><svg data-lucide="bar-chart-3"></svg>Flujo neto real por mes</h2>
      <div class="legend"><span><i style="background:var(--acai)"></i>Flujo neto real</span></div>
      <div class="chart-wrap" id="chartWrap"></div>
    </section>

    <section class="panel">
      <h2><svg data-lucide="calendar-clock"></svg>Detalle mensual — real / proyectado</h2>
      <table>
        <thead><tr><th>Mes</th><th>Total real</th><th>Total proyectado</th><th>Diferencia</th><th>Flujo acumulado</th></tr></thead>
        <tbody id="monthlyBody"></tbody>
      </table>
    </section>
  `;

  main.querySelectorAll('[data-countup]').forEach(el => countUp(el, parseFloat(el.dataset.countup), el.dataset.cur));

  const allMonths = Array.from(new Set([...Object.keys(monthReal), ...Object.keys(monthProj)])).sort();
  const tbody = document.getElementById('monthlyBody');
  let cum = 0;
  allMonths.forEach(m => {
    const r = monthReal[m], p = monthProj[m];
    const hasR = r !== undefined, hasP = p !== undefined;
    if (hasR) cum += r;
    const diff = (hasR && hasP) ? (r - p) : null;
    const [y, mo] = m.split('-');
    const label = MONTHS_ES[parseInt(mo,10)-1] + ' ' + y;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="${monthPartial[m] ? 'month-partial' : ''}">${label}${monthPartial[m] ? '<span class="partial-flag">parcial</span>' : ''}</td>
      <td>${hasR ? fmt(r, cur) : '—'}</td>
      <td>${hasP ? fmt(p, cur) : '—'}</td>
      <td class="${diff !== null ? (diff >= 0 ? 'diff-pos' : 'diff-neg') : ''}">${diff !== null ? fmt(diff, cur) : '—'}</td>
      <td>${hasR ? fmt(cum, cur) : '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  renderChart(allMonths, monthReal);
  icons();
}

function renderChart(months, monthReal) {
  const wrap = document.getElementById('chartWrap');
  const w = Math.max(560, months.length * 56), h = 200, padBottom = 28, barW = 26, groupW = w / months.length;
  const vals = months.map(m => monthReal[m] || 0);
  const maxAbs = Math.max(...vals.map(v => Math.abs(v)), 1);
  const zeroY = h - padBottom - (h - padBottom - 10) / 2;
  const scale = (v) => (v / maxAbs) * ((h - padBottom - 10) / 2);
  let bars = '';
  months.forEach((m, i) => {
    const v = monthReal[m] || 0;
    const cx = i * groupW + groupW / 2;
    const barH = Math.abs(scale(v));
    const y = v >= 0 ? zeroY - barH : zeroY;
    const [y4, mo] = m.split('-');
    bars += `
      <rect fill="${v >= 0 ? 'var(--acai)' : 'var(--rust)'}" x="${cx - barW/2}" y="${zeroY}" width="${barW}" height="0" rx="2" data-final-y="${y}" data-final-h="${barH || 1}"></rect>
      <text class="chart-axis-label" x="${cx}" y="${h - 8}" text-anchor="middle">${MONTHS_ES[parseInt(mo,10)-1]}</text>
    `;
  });
  wrap.innerHTML = `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><line x1="0" y1="${zeroY}" x2="${w}" y2="${zeroY}" stroke="var(--border)"></line>${bars}</svg>`;
  requestAnimationFrame(() => {
    wrap.querySelectorAll('rect[data-final-y]').forEach(rect => {
      rect.setAttribute('y', rect.dataset.finalY);
      rect.setAttribute('height', rect.dataset.finalH);
    });
  });
}

load();
</script>

</body>
</html>
