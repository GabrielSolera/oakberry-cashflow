<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OakBerry Centroamérica · Flujo de Caja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF9F6;
    --ink: #221A2B;
    --ink-soft: #6B6274;
    --acai: #4A1942;
    --acai-soft: #7A4270;
    --mint: #2E7D53;
    --mint-bg: #E7F3EC;
    --rust: #B4402A;
    --rust-bg: #FBEBE7;
    --border: #E5E1DC;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 36px 48px 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .brand .mark {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, var(--acai-soft), var(--acai) 70%);
    flex-shrink: 0;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }

  nav.countries {
    display: flex;
    gap: 4px;
    background: #F0EDE8;
    padding: 4px;
    border-radius: 10px;
  }
  nav.countries button {
    border: none;
    background: transparent;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    border-radius: 7px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  nav.countries button.active {
    background: var(--card);
    color: var(--acai);
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  nav.countries button:disabled { opacity: .4; cursor: default; }

  main { padding: 32px 48px 64px; max-width: 1180px; }

  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }
  .kpi .label { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .kpi .value { font-family: 'Fraunces', serif; font-size: 25px; font-weight: 500; letter-spacing: -0.01em; }
  .kpi .value.neg { color: var(--rust); }
  .kpi .value.pos { color: var(--mint); }

  section.panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 26px 8px;
    margin-bottom: 24px;
  }
  section.panel h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 17px;
    margin: 0 0 18px;
  }

  .chart-wrap { overflow-x: auto; }
  svg.chart { display: block; }
  .bar-income { fill: var(--acai); }
  .bar-expense { fill: #D8CFE0; }
  .chart-axis-label { font-size: 11px; fill: var(--ink-soft); font-family: 'IBM Plex Sans', sans-serif; }
  .legend { display: flex; gap: 20px; margin-bottom: 6px; font-size: 12.5px; color: var(--ink-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    margin-bottom: 8px;
  }
  th, td {
    text-align: right;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 12px;
    text-transform: none;
  }
  tbody tr:last-child td { border-bottom: none; }
  td.month-partial { color: var(--ink-soft); }
  .partial-flag {
    font-size: 10.5px;
    color: var(--ink-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 6px;
  }
  tfoot td { font-weight: 600; border-top: 1.5px solid var(--ink); border-bottom: none; padding-top: 12px; }

  .empty-state {
    padding: 48px 12px 56px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state .big { font-family: 'Fraunces', serif; font-size: 18px; color: var(--ink); margin-bottom: 6px; }

  .loading { padding: 60px 0; text-align: center; color: var(--ink-soft); font-size: 14px; }

  footer {
    padding: 0 48px 48px;
    color: var(--ink-soft);
    font-size: 12.5px;
  }

  @media (max-width: 760px) {
    header, main, footer { padding-left: 20px; padding-right: 20px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark"></span>
    <div>
      <h1>Flujo de caja · OakBerry Centroamérica</h1>
      <div class="subtitle">Proyectado vs. real, por país y mes</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:20px;">
    <a href="carga.html" style="font-size:14px; color:var(--acai); text-decoration:none; border-bottom:1px solid transparent;" onmouseover="this.style.borderBottomColor='var(--acai)'" onmouseout="this.style.borderBottomColor='transparent'">Carga mensual →</a>
    <nav class="countries" id="countryNav"></nav>
  </div>
</header>

<main id="main">
  <div class="loading">Cargando datos…</div>
</main>

<footer>Fuente: catálogo contable QuickBooks · datos reales cargados hasta agosto 2026 (parcial)</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://dwxovleqwqmeqrjiyqyf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3eG92bGVxd3FtZXFyaml5cXlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNDQ0MDksImV4cCI6MjEwMzcyMDQwOX0.b76ZdNVFuG9fK_gQKPtZnNpEykFgv0uGA9B91RsKKgk';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'cashflow' } });

const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Set','Oct','Nov','Dic'];
const fmt = (n, currency) => {
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(Math.round(n));
  return sign + (currency === 'CRC' ? '₡' : '$') + abs.toLocaleString('es-CR');
};

let countries = [];
let actualsByCountry = {}; // country_id -> array of {month, amount, section, is_partial}
let activeCountryId = null;

async function load() {
  const { data: countryRows, error: cErr } = await sb.from('countries').select('id,name,currency_code').order('id');
  if (cErr) { renderError(cErr); return; }
  countries = countryRows;

  const { data: rows, error: aErr } = await sb
    .from('cash_flow_actual')
    .select('amount,month,is_partial_month,country_id,accounts(section)');
  if (aErr) { renderError(aErr); return; }

  actualsByCountry = {};
  for (const c of countries) actualsByCountry[c.id] = [];
  for (const r of rows) {
    if (!actualsByCountry[r.country_id]) actualsByCountry[r.country_id] = [];
    actualsByCountry[r.country_id].push({
      month: r.month,
      amount: Number(r.amount),
      section: r.accounts ? r.accounts.section : null,
      partial: r.is_partial_month
    });
  }

  activeCountryId = countries.find(c => actualsByCountry[c.id]?.length)?.id ?? countries[0]?.id;
  renderNav();
  renderCountry(activeCountryId);
}

function renderError(err) {
  document.getElementById('main').innerHTML = `
    <div class="empty-state">
      <div class="big">No se pudo cargar la información</div>
      <div>${err.message || err}</div>
      <div style="margin-top:8px;">Revisa que el schema <code>cashflow</code> esté expuesto en Project Settings → Data API → Exposed schemas.</div>
    </div>`;
}

function renderNav() {
  const nav = document.getElementById('countryNav');
  nav.innerHTML = '';
  countries.forEach(c => {
    const btn = document.createElement('button');
    btn.textContent = c.name;
    if (c.id === activeCountryId) btn.classList.add('active');
    btn.addEventListener('click', () => { activeCountryId = c.id; renderNav(); renderCountry(c.id); });
    nav.appendChild(btn);
  });
}

function renderCountry(countryId) {
  const country = countries.find(c => c.id === countryId);
  const data = actualsByCountry[countryId] || [];
  const main = document.getElementById('main');

  if (!data.length) {
    main.innerHTML = `
      <div class="empty-state">
        <div class="big">Todavía no hay datos cargados para ${country.name}</div>
        <div>En cuanto tengas el reporte contable de este país, lo cargamos igual que se hizo con Costa Rica.</div>
      </div>`;
    return;
  }

  // Aggregate by month and section
  const monthMap = {}; // 'YYYY-MM-01' -> {income, cogs, expense, other_income, other_expense, partial}
  for (const r of data) {
    if (!monthMap[r.month]) monthMap[r.month] = { income: 0, cogs: 0, expense: 0, other_income: 0, other_expense: 0, partial: false };
    const bucket = monthMap[r.month];
    if (r.section === 'income') bucket.income += r.amount;
    else if (r.section === 'cogs') bucket.cogs += r.amount;
    else if (r.section === 'expense') bucket.expense += r.amount;
    else if (r.section === 'other_income') bucket.other_income += r.amount;
    else if (r.section === 'other_expense') bucket.other_expense += r.amount;
    if (r.partial) bucket.partial = true;
  }
  const months = Object.keys(monthMap).sort();

  const totalIncome = months.reduce((s, m) => s + monthMap[m].income + monthMap[m].other_income, 0);
  const totalCogs = months.reduce((s, m) => s + monthMap[m].cogs, 0);
  const totalExpense = months.reduce((s, m) => s + monthMap[m].expense + monthMap[m].other_expense, 0);
  const totalNet = totalIncome - totalCogs - totalExpense;

  const cur = country.currency_code;

  main.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Ingresos totales</div><div class="value">${fmt(totalIncome, cur)}</div></div>
      <div class="kpi"><div class="label">Costo de ventas</div><div class="value">${fmt(totalCogs, cur)}</div></div>
      <div class="kpi"><div class="label">Gastos operativos</div><div class="value">${fmt(totalExpense, cur)}</div></div>
      <div class="kpi"><div class="label">Resultado neto</div><div class="value ${totalNet >= 0 ? 'pos' : 'neg'}">${fmt(totalNet, cur)}</div></div>
    </div>

    <section class="panel">
      <h2>Ingresos vs. gastos por mes</h2>
      <div class="legend">
        <span><i style="background:var(--acai)"></i>Ingresos</span>
        <span><i style="background:#D8CFE0"></i>Costo de ventas + gastos</span>
      </div>
      <div class="chart-wrap" id="chartWrap"></div>
    </section>

    <section class="panel">
      <h2>Detalle mensual</h2>
      <table>
        <thead>
          <tr>
            <th>Mes</th><th>Ingresos</th><th>Costo de ventas</th><th>Gastos</th><th>Otros</th><th>Neto</th>
          </tr>
        </thead>
        <tbody id="monthlyBody"></tbody>
        <tfoot>
          <tr>
            <td>Total</td>
            <td>${fmt(totalIncome, cur)}</td>
            <td>${fmt(totalCogs, cur)}</td>
            <td>${fmt(totalExpense - months.reduce((s,m)=>s+monthMap[m].other_expense,0), cur)}</td>
            <td>${fmt(months.reduce((s,m)=>s+monthMap[m].other_income - monthMap[m].other_expense,0), cur)}</td>
            <td>${fmt(totalNet, cur)}</td>
          </tr>
        </tfoot>
      </table>
    </section>
  `;

  const tbody = document.getElementById('monthlyBody');
  months.forEach(m => {
    const b = monthMap[m];
    const income = b.income + b.other_income;
    const expense = b.expense;
    const other = b.other_income - b.other_expense;
    const net = income - b.cogs - b.expense - b.other_expense;
    const [y, mo] = m.split('-');
    const label = MONTHS_ES[parseInt(mo, 10) - 1] + ' ' + y;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="${b.partial ? 'month-partial' : ''}">${label}${b.partial ? '<span class="partial-flag">parcial</span>' : ''}</td>
      <td>${fmt(income, cur)}</td>
      <td>${fmt(b.cogs, cur)}</td>
      <td>${fmt(expense, cur)}</td>
      <td>${fmt(other, cur)}</td>
      <td>${fmt(net, cur)}</td>
    `;
    tbody.appendChild(tr);
  });

  renderChart(months, monthMap);
}

function renderChart(months, monthMap) {
  const wrap = document.getElementById('chartWrap');
  const w = Math.max(560, months.length * 64);
  const h = 200;
  const padBottom = 28;
  const barW = 20;
  const groupW = w / months.length;

  const maxVal = Math.max(...months.map(m => {
    const b = monthMap[m];
    return Math.max(b.income + b.other_income, b.cogs + b.expense + b.other_expense);
  })) || 1;

  const scale = (v) => (v / maxVal) * (h - padBottom - 10);

  let bars = '';
  months.forEach((m, i) => {
    const b = monthMap[m];
    const income = b.income + b.other_income;
    const spend = b.cogs + b.expense + b.other_expense;
    const cx = i * groupW + groupW / 2;
    const incomeH = scale(income);
    const spendH = scale(spend);
    const [y, mo] = m.split('-');
    bars += `
      <rect class="bar-income" x="${cx - barW - 2}" y="${h - padBottom - incomeH}" width="${barW}" height="${incomeH}" rx="2"></rect>
      <rect class="bar-expense" x="${cx + 2}" y="${h - padBottom - spendH}" width="${barW}" height="${spendH}" rx="2"></rect>
      <text class="chart-axis-label" x="${cx}" y="${h - 8}" text-anchor="middle">${MONTHS_ES[parseInt(mo,10)-1]}</text>
    `;
  });

  wrap.innerHTML = `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}

load();
</script>

</body>
</html>
